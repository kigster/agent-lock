inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.2

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Specs are prose: an example group that reads well is worth more than one
# that fits in 25 lines, and RSpec blocks are not methods.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "*.gemspec"

# The library's documented objects are long because the comments are long.
Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 20
